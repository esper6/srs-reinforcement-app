# Canonicalize www → apex so it doesn't fall through to the default server (the relay)
server {
    listen 80;
    server_name www.memorydump.app;
    return 301 $scheme://memorydump.app$request_uri;
}

server {
    listen 80;
    server_name memorydump.app;

    # Certbot will add SSL config here after: certbot --nginx -d memorydump.app -d www.memorydump.app

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # SSE support (chat streaming)
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
